openapi: 3.0.3

info:
  title: Movie Booking System API
  description: |
    Multi-city, multi-theatre movie ticket booking platform built on Java 21 + Spring Boot 3.3.5.

    ## Authentication
    Most endpoints require a JWT Bearer token. Obtain one via `POST /api/auth/login` or `POST /api/auth/register`.
    Pass it in the `Authorization` header as `Bearer <token>`.

    ## Roles
    | Role | Access |
    |---|---|
    | **CUSTOMER** | Browse, hold seats, book, cancel, view history |
    | **ADMIN** | Full catalogue management (cities, theatres, screens, movies, shows, pricing, discounts, refund policies) |

    ## Error Shape
    All error responses follow `{ "status": <int>, "message": "<string>", "timestamp": "<ISO-8601>" }`.
  version: 1.0.0
  contact:
    email: manya@adobe.com

servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Auth
    description: Registration and login
  - name: Movies
    description: Public movie catalogue
  - name: Shows
    description: Public show and seat availability
  - name: Holds
    description: Temporary seat holds (CUSTOMER)
  - name: Bookings
    description: Booking lifecycle — create, cancel, history (CUSTOMER)
  - name: Admin — Cities
    description: City catalogue management (ADMIN)
  - name: Admin — Theatres
    description: Theatre catalogue management (ADMIN)
  - name: Admin — Screens
    description: Screen and bulk seat management (ADMIN)
  - name: Admin — Movies
    description: Movie catalogue management (ADMIN)
  - name: Admin — Shows
    description: Show scheduling (ADMIN)
  - name: Admin — Pricing Tiers
    description: Pricing tier management (ADMIN)
  - name: Admin — Discount Codes
    description: Discount code management (ADMIN)
  - name: Admin — Refund Policies
    description: Refund policy management (ADMIN)

security: []   # default: public; overridden per-operation

components:

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  # ─── Enums ──────────────────────────────────────────────────────────────────

  schemas:

    Role:
      type: string
      enum: [ADMIN, CUSTOMER]

    SeatType:
      type: string
      enum: [REGULAR, PREMIUM]

    DayType:
      type: string
      enum: [WEEKDAY, WEEKEND]

    SeatStatus:
      type: string
      enum: [AVAILABLE, HELD, BOOKED]

    BookingStatus:
      type: string
      enum: [PENDING, CONFIRMED, CANCELLED, REFUNDED]
      description: PENDING is reserved for a future async payment flow.

    PaymentStatus:
      type: string
      enum: [PENDING, SUCCESS, FAILED]
      description: PENDING and FAILED are reserved for a future async payment flow. Only SUCCESS is persisted currently.

    PaymentMethod:
      type: string
      enum: [UPI, CARD, WALLET]

    DiscountType:
      type: string
      enum: [FLAT, PERCENTAGE]

    NotificationType:
      type: string
      enum: [BOOKING_CONFIRMED, BOOKING_CANCELLED, REFUND_PROCESSED, SHOW_REMINDER]

    NotificationStatus:
      type: string
      enum: [PENDING, SENT, FAILED]

    # ─── Request schemas ───────────────────────────────────────────────────────

    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          example: Alice Smith
        email:
          type: string
          format: email
          example: alice@example.com
        password:
          type: string
          minLength: 6
          example: secret123

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: alice@example.com
        password:
          type: string
          example: secret123

    CreateCityRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: Mumbai

    CreateTheatreRequest:
      type: object
      required: [name, cityId]
      properties:
        name:
          type: string
          example: PVR Cinemas
        address:
          type: string
          example: Phoenix Mall, Lower Parel
        cityId:
          type: integer
          format: int64
          example: 1

    CreateScreenRequest:
      type: object
      required: [name, totalSeats, theatreId]
      properties:
        name:
          type: string
          example: Screen 1
        totalSeats:
          type: integer
          minimum: 1
          example: 150
        theatreId:
          type: integer
          format: int64
          example: 2

    SeatEntry:
      type: object
      required: [rowNumber, seatNumber, seatType]
      properties:
        rowNumber:
          type: integer
          minimum: 1
          example: 3
        seatNumber:
          type: integer
          minimum: 1
          example: 12
        seatType:
          $ref: '#/components/schemas/SeatType'

    BulkCreateSeatsRequest:
      type: object
      required: [seats]
      properties:
        seats:
          type: array
          items:
            $ref: '#/components/schemas/SeatEntry'
          example:
            - rowNumber: 1
              seatNumber: 1
              seatType: REGULAR
            - rowNumber: 1
              seatNumber: 2
              seatType: PREMIUM

    CreateMovieRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          example: Interstellar
        description:
          type: string
          maxLength: 1000
          example: A team of explorers travel through a wormhole in space.
        duration:
          type: integer
          minimum: 1
          description: Duration in minutes
          example: 169
        language:
          type: string
          example: English
        genre:
          type: string
          example: Sci-Fi

    CreateShowRequest:
      type: object
      required: [movieId, screenId, startTime, endTime]
      properties:
        movieId:
          type: integer
          format: int64
          example: 1
        screenId:
          type: integer
          format: int64
          example: 3
        startTime:
          type: string
          format: date-time
          example: "2025-07-15T18:00:00"
        endTime:
          type: string
          format: date-time
          example: "2025-07-15T20:49:00"

    CreatePricingTierRequest:
      type: object
      required: [seatType, dayType, basePrice]
      properties:
        seatType:
          $ref: '#/components/schemas/SeatType'
        dayType:
          $ref: '#/components/schemas/DayType'
        basePrice:
          type: number
          format: decimal
          minimum: 0.01
          example: 200.00
        multiplier:
          type: number
          format: double
          minimum: 0.01
          default: 1.0
          example: 1.5

    CreateDiscountCodeRequest:
      type: object
      required: [code, discountType, discountValue, validFrom, validTill, maxUsage]
      properties:
        code:
          type: string
          example: SUMMER20
        discountType:
          $ref: '#/components/schemas/DiscountType'
        discountValue:
          type: number
          format: decimal
          minimum: 0.01
          example: 50.00
        validFrom:
          type: string
          format: date
          example: "2025-06-01"
        validTill:
          type: string
          format: date
          example: "2025-08-31"
        maxUsage:
          type: integer
          minimum: 1
          example: 100

    CreateRefundPolicyRequest:
      type: object
      required: [minHoursBeforeShow, refundPercentage]
      properties:
        minHoursBeforeShow:
          type: integer
          minimum: 0
          description: Lower bound of the time band (inclusive), in hours before show start
          example: 12
        refundPercentage:
          type: integer
          minimum: 0
          maximum: 100
          example: 100

    CreateSeatHoldRequest:
      type: object
      required: [showId, seatIds]
      properties:
        showId:
          type: integer
          format: int64
          example: 5
        seatIds:
          type: array
          items:
            type: integer
            format: int64
          minItems: 1
          example: [10, 11, 12]

    CreateBookingRequest:
      type: object
      required: [holdId, paymentMethod]
      properties:
        holdId:
          type: integer
          format: int64
          example: 7
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        discountCode:
          type: string
          nullable: true
          example: SUMMER20

    # ─── Response schemas ──────────────────────────────────────────────────────

    AuthResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        email:
          type: string
          format: email
          example: alice@example.com
        role:
          $ref: '#/components/schemas/Role'

    CityResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Mumbai

    TheatreResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 2
        name:
          type: string
          example: PVR Cinemas
        address:
          type: string
          example: Phoenix Mall, Lower Parel
        cityId:
          type: integer
          format: int64
          example: 1
        cityName:
          type: string
          example: Mumbai

    ScreenResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 3
        name:
          type: string
          example: Screen 1
        totalSeats:
          type: integer
          example: 150
        theatreId:
          type: integer
          format: int64
          example: 2
        theatreName:
          type: string
          example: PVR Cinemas

    ShowSeatResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 101
        seatId:
          type: integer
          format: int64
          example: 10
        rowNumber:
          type: integer
          example: 3
        seatNumber:
          type: integer
          example: 12
        seatType:
          $ref: '#/components/schemas/SeatType'
        status:
          $ref: '#/components/schemas/SeatStatus'

    MovieResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        title:
          type: string
          example: Interstellar
        description:
          type: string
          example: A team of explorers travel through a wormhole in space.
        duration:
          type: integer
          description: Duration in minutes
          example: 169
        language:
          type: string
          example: English
        genre:
          type: string
          example: Sci-Fi

    ShowResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 5
        movieId:
          type: integer
          format: int64
          example: 1
        movieTitle:
          type: string
          example: Interstellar
        screenId:
          type: integer
          format: int64
          example: 3
        screenName:
          type: string
          example: Screen 1
        theatreName:
          type: string
          example: PVR Cinemas
        startTime:
          type: string
          format: date-time
          example: "2025-07-15T18:00:00"
        endTime:
          type: string
          format: date-time
          example: "2025-07-15T20:49:00"

    SeatHoldResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 7
        showId:
          type: integer
          format: int64
          example: 5
        showSeatIds:
          type: array
          items:
            type: integer
            format: int64
          example: [101, 102, 103]
        createdAt:
          type: string
          format: date-time
          example: "2025-07-15T17:30:00"
        expiresAt:
          type: string
          format: date-time
          example: "2025-07-15T17:40:00"

    BookingResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 20
        showId:
          type: integer
          format: int64
          example: 5
        movieTitle:
          type: string
          example: Interstellar
        bookedSeats:
          type: array
          items:
            $ref: '#/components/schemas/ShowSeatResponse'
        totalAmount:
          type: number
          format: decimal
          example: 450.00
        bookingStatus:
          $ref: '#/components/schemas/BookingStatus'
        bookedAt:
          type: string
          format: date-time
          example: "2025-07-15T17:32:00"

    PricingTierResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        seatType:
          $ref: '#/components/schemas/SeatType'
        dayType:
          $ref: '#/components/schemas/DayType'
        basePrice:
          type: number
          format: decimal
          example: 200.00
        multiplier:
          type: number
          format: double
          example: 1.5
        effectivePrice:
          type: number
          format: decimal
          description: Computed as basePrice × multiplier (scale 2, HALF_UP)
          example: 300.00

    DiscountCodeResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 3
        code:
          type: string
          example: SUMMER20
        discountType:
          $ref: '#/components/schemas/DiscountType'
        discountValue:
          type: number
          format: decimal
          example: 50.00
        validFrom:
          type: string
          format: date
          example: "2025-06-01"
        validTill:
          type: string
          format: date
          example: "2025-08-31"
        maxUsage:
          type: integer
          example: 100
        currentUsage:
          type: integer
          example: 12

    RefundPolicyResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        minHoursBeforeShow:
          type: integer
          example: 12
        refundPercentage:
          type: integer
          example: 100

    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
          example: 400
        message:
          type: string
          example: Seat is not available for booking
        timestamp:
          type: string
          format: date-time
          example: "2025-07-15T17:30:00"

    # ─── Paginated wrappers ────────────────────────────────────────────────────

    PageMetadata:
      type: object
      properties:
        totalElements:
          type: integer
          format: int64
          example: 50
        totalPages:
          type: integer
          example: 3
        size:
          type: integer
          example: 20
        number:
          type: integer
          description: Zero-based current page index
          example: 0
        first:
          type: boolean
          example: true
        last:
          type: boolean
          example: false
        numberOfElements:
          type: integer
          example: 20
        empty:
          type: boolean
          example: false

    PagedMovieResponse:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/MovieResponse'

    PagedShowResponse:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/ShowResponse'

    PagedBookingResponse:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/BookingResponse'

  # ─── Reusable responses ──────────────────────────────────────────────────────

  responses:
    Unauthorized:
      description: Missing or invalid JWT token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 401
            message: Unauthorized
            timestamp: "2025-07-15T17:30:00"

    Forbidden:
      description: Authenticated but role not permitted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 403
            message: Access denied
            timestamp: "2025-07-15T17:30:00"

    NotFound:
      description: Requested resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 404
            message: Resource not found
            timestamp: "2025-07-15T17:30:00"

    Conflict:
      description: Optimistic lock conflict — seat was modified concurrently; retry the request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 409
            message: Seat was modified by another transaction; please retry
            timestamp: "2025-07-15T17:30:00"

  # ─── Reusable parameters ─────────────────────────────────────────────────────

  parameters:
    PageParam:
      name: page
      in: query
      description: Zero-based page index (default 0)
      schema:
        type: integer
        default: 0
        minimum: 0
    SizeParam:
      name: size
      in: query
      description: Page size (default 20)
      schema:
        type: integer
        default: 20
        minimum: 1

# ═══════════════════════════════════════════════════════════════════════════════
# Paths
# ═══════════════════════════════════════════════════════════════════════════════

paths:

  # ─── Auth ──────────────────────────────────────────────────────────────────

  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: Registration successful — returns JWT token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation error or email already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Authenticate and receive a JWT token
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful — returns JWT token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Bad credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ─── Movies (public) ───────────────────────────────────────────────────────

  /api/movies:
    get:
      tags: [Movies]
      summary: List all movies (paginated)
      operationId: getAllMovies
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Paginated list of movies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedMovieResponse'

  /api/movies/{id}:
    get:
      tags: [Movies]
      summary: Get a movie by ID
      operationId: getMovieById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Movie detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  # ─── Shows (public) ────────────────────────────────────────────────────────

  /api/cities/{cityId}/shows:
    get:
      tags: [Shows]
      summary: List all shows in a city (paginated)
      operationId: getShowsByCity
      parameters:
        - name: cityId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Paginated list of shows in the city
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedShowResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/shows/{id}:
    get:
      tags: [Shows]
      summary: Get show detail by ID
      operationId: getShowById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Show detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShowResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/shows/{id}/seats:
    get:
      tags: [Shows]
      summary: Get seat availability for a show
      operationId: getShowSeats
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: List of show seats with current availability status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShowSeatResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  # ─── Seat Holds (CUSTOMER) ─────────────────────────────────────────────────

  /api/holds:
    post:
      tags: [Holds]
      summary: Hold one or more seats for a show
      description: |
        Temporarily reserves the requested seats for the authenticated customer.
        The hold expires after the configured hold duration (default 10 minutes).
        All seats must be AVAILABLE; if any seat is HELD or BOOKED the request is rejected.
        Returns HTTP 409 if an optimistic lock conflict is detected (concurrent selection of the same seat).
      operationId: createHold
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSeatHoldRequest'
      responses:
        '200':
          description: Hold created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeatHoldResponse'
        '400':
          description: One or more seats are not available or not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  # ─── Bookings (CUSTOMER) ───────────────────────────────────────────────────

  /api/bookings:
    post:
      tags: [Bookings]
      summary: Confirm a seat hold into a booking
      description: |
        Converts an active hold into a confirmed booking by processing payment.

        **Happy path:** validates hold ownership and expiry → calculates price per seat from
        PricingTier (SeatType × DayType) → applies optional discount → processes payment via
        the selected gateway → marks seats BOOKED → creates Booking (CONFIRMED) + Payment (SUCCESS)
        → fires async `BookingConfirmedEvent`.

        **Payment failure:** resets all held seats to AVAILABLE and expires the hold immediately;
        does not create a Booking record. Returns HTTP 400.
      operationId: createBooking
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingRequest'
      responses:
        '200':
          description: Booking confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
        '400':
          description: |
            One of:
            - Hold has expired
            - Hold does not belong to the authenticated customer
            - Payment gateway returned failure
            - Discount code invalid, expired, or over usage limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Hold not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/bookings/{id}/cancel:
    patch:
      tags: [Bookings]
      summary: Cancel a confirmed booking
      description: |
        Cancels a CONFIRMED booking. Refund amount is determined by the closest matching
        RefundPolicy time band (`minHoursBeforeShow`).

        - `refundAmount > 0` → `bookingStatus = REFUNDED`; fires `BookingCancelledEvent` + `RefundProcessedEvent`
        - `refundAmount = 0` → `bookingStatus = CANCELLED`; fires `BookingCancelledEvent` only

        Cancelled seats are immediately returned to AVAILABLE status.
      operationId: cancelBooking
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Booking cancelled (or refunded)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
        '400':
          description: |
            One of:
            - Booking does not belong to the authenticated customer
            - Booking is not in CONFIRMED status
            - Show has already started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/bookings/history:
    get:
      tags: [Bookings]
