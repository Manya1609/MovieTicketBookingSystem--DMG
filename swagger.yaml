    post:
      tags: [Admin — Refund Policies]
      summary: Create a refund policy time band
      description: |
        Defines a time-band refund rule. When a booking is cancelled, the system selects the
        policy whose `minHoursBeforeShow` is the closest match (largest value that is ≤ hours
        remaining before show start).

        Example configuration:
        | minHoursBeforeShow | refundPercentage |
        |---|---|
        | 12 | 100 |
        | 4  | 50  |
        | 1  | 25  |
        | 0  | 0   |
      operationId: createRefundPolicy
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRefundPolicyRequest'
      responses:
