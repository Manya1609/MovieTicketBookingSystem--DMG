# PostgreSQL Datasource
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/moviedb}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
app.jwt.secret=${JWT_SECRET:bW92aWVib29raW5nc3lzdGVtc2VjcmV0a2V5dmVyeWxvbmdzZWNyZXQ=}
app.jwt.expiration=86400000

# Seat hold duration in minutes
app.hold.duration.minutes=10
